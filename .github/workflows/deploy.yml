name: deploy-public-saas
on:
  push:
    branches: [main]
    paths:
      - "server.js"
      - "package.json"
      - "public/**"
      - "ops/hostinger_archive_upload.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted]
    timeout-minutes: 12
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate runtime
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${HOSTINGER_API_TOKEN:-}" ]
          npm install --no-audit --no-fund
          node --check server.js
          node server.js >/tmp/legal-saas.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..10}; do
            if curl -sf http://127.0.0.1:3000/ >/tmp/legal-saas.html; then break; fi
            sleep 1
          done
          grep -q 'HomoSapiens Legal' /tmp/legal-saas.html
          kill "$pid" 2>/dev/null || true
          trap - EXIT
      - name: Package exact app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          files=["server.js","package.json","public/index.html"]
          with zipfile.ZipFile("legal-saas.zip","w",zipfile.ZIP_DEFLATED) as z:
              for f in files: z.write(f)
          PY
      - name: Submit Hostinger build
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund axios tus-js-client
          node ops/hostinger_archive_upload.mjs legal-saas.zip
